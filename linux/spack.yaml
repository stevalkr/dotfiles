# Root specs are exact selections; concretization writes the lock file and the
# build command generates the environment view.
spack:
  specs:
  - llvm@=22.1.5 +clang +lld ~lldb ~flang ~mlir openmp=runtime ~offload ~libomptarget ~cuda build_type=Release ^python@=3.13.13
  - neovim@=0.13.0-dev.20260922
  - tmux@=3.7c ~static ~jemalloc +utf8proc
  - wezterm@=20261005.3725482
  - python@=3.13.13 +shared +ssl +sqlite3 +readline +bz2 +lzma +zlib ~tkinter ~tests
  - py-pyink@=26.5.1 ^py-black@=26.5.1+jupyter~d~colorama~uvloop ^python@=3.13.13
  - py-pynvim@=0.4.3 ^python@=3.13.13
  - py-pillow@=12.2.0 +zlib +jpeg +tiff +webp +freetype +lcms +jpeg2000 ~raqm ~imagequant ~xcb ~avif ^python@=3.13.13
  - py-nbformat@=5.10.4 ^python@=3.13.13
  - py-jupytext@=1.16.0 ^python@=3.13.13
  - py-jupyter-client@=8.8.0 ^python@=3.13.13
  - py-codespell@=2.4.1 ^python@=3.13.13
  - node-js@=26.7.0 +openssl +zlib ~doc
  - node-neovim@=5.4.0 ^node-js@=26.7.0
  - markdownlint-cli@=0.49.1 ^node-js@=26.7.0
  - pyright@=1.1.413 ^node-js@=26.7.0
  - fd@=10.4.2
  - ripgrep@=15.1.0 +pcre2
  - bat@=0.24.0
  - tree-sitter@=0.27.0-dev.20260821 +cli
  - fzf@=0.73.1 ~vim
  - imagemagick@=7.1.1-39 +zlib ~ghostscript ~rsvg
  - stow@=2.4.1
  - direnv@=2.37.1
  - zoxide@=0.9.8
  - py-cmakelang@=0.6.13 ^python@=3.13.13
  - prettierd@=0.29.0 ^node-js@=26.7.0
  - py-cairosvg@=2.7.1 ^py-cairocffi@=1.7.1 ^python@=3.13.13
  - py-pyperclip@=1.11.0 ^python@=3.13.13
  - fish@=4.2.0 ~docs
  - bubblewrap@=0.11.0
  - rocketchat-tui@=2022.11.21
  - monaspace-nerd-fonts@=1.400
  # The build frontend bind-mounts out/environment at the parent of this path.
  # A stable container path keeps views deterministic across build servers.
  view: /opt/dev-env-root/view
  concretizer:
    unify: true
    reuse: false
