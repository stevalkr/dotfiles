config:
  install_tree:
    root: /opt/padded-spack-store
    padded_length: 128
    projections:
      all: "{architecture.platform}-{architecture.target}/{name}-{version}-{hash}"
  build_stage:
  - /opt/dev-env-build-stage
  source_cache: /opt/dev-env-source-cache
  misc_cache: /opt/dev-env-misc-cache
  checksum: true
  # Use curl's proxy handling and retry transient transport/server failures.
  url_fetch_method: curl --retry 5 --retry-delay 2 --retry-connrefused
  dirty: false
  locks: true
