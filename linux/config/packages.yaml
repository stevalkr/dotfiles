packages:
  all:
    require: "target=x86_64"
  c:
    require: "gcc@8.5.0"
  cxx:
    require: "gcc@8.5.0"
  fortran:
    require: "gcc@8.5.0"
  python:
    require: "@=3.13.13"
  py-numpy:
    require: "@=2.2.6"
  gcc:
    externals:
    - spec: "gcc@8.5.0 languages='c,c++,fortran'"
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    buildable: false
  glibc:
    externals:
    - spec: glibc@2.28
      prefix: /usr
    buildable: false
